name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RICK_AND_MORTY_BASE_URL: ${{ vars.RICK_AND_MORTY_BASE_URL }}
  DEMO_CLIENT_ID: ${{ vars.DEMO_CLIENT_ID }}
  DEMO_TENANT_ID: ${{ vars.DEMO_TENANT_ID }}
  RICK_AND_MORTY_API_KEY: ${{ secrets.RICK_AND_MORTY_API_KEY }}
  DEMO_ACCESS_TOKEN: ${{ secrets.DEMO_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Report configuration sources
        run: ./gradlew secretsStatus

      - name: Test, lint and assemble
        run: ./gradlew test lintDebug assembleDebug --warning-mode all
