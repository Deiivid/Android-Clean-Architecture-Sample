def generatedConfigurationDirectory = layout.buildDirectory.dir(
        'generated/catalogConfiguration/commonMain/kotlin'
)
def kotlinString = { String value ->
    "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')
            .replace('\n', '\\n').replace('\r', '\\r')}\""
}
def generateCatalogConfiguration = tasks.register('generateCatalogConfiguration') {
    outputs.dir(generatedConfigurationDirectory)
    doNotTrackState('Configuration can contain credentials and must not enter Gradle task history.')

    doLast {
        def packageDirectory = generatedConfigurationDirectory.get().dir(
                'es/davidnavarro/androidcleanarchitecture/config'
        ).asFile
        packageDirectory.mkdirs()
        def destination = new File(packageDirectory, 'GeneratedCatalogConfiguration.kt')
        def baseUrl = rootProject.ext.resolveCatalogConfigurationValue(
                'RICK_AND_MORTY_BASE_URL',
                'https://rickandmortyapi.com/api/',
        )
        def apiKey = rootProject.ext.resolveCatalogCredentialValue('RICK_AND_MORTY_API_KEY')
        def clientId = rootProject.ext.resolveCatalogCredentialValue('DEMO_CLIENT_ID')
        def tenantId = rootProject.ext.resolveCatalogCredentialValue('DEMO_TENANT_ID')
        def accessToken = rootProject.ext.resolveCatalogCredentialValue('DEMO_ACCESS_TOKEN')

        destination.text = """\
package es.davidnavarro.androidcleanarchitecture.config

internal object GeneratedCatalogConfiguration {
    const val BASE_URL: String = ${kotlinString(baseUrl)}
    const val API_KEY: String = ${kotlinString(apiKey)}
    const val CLIENT_ID: String = ${kotlinString(clientId)}
    const val TENANT_ID: String = ${kotlinString(tenantId)}
    const val ACCESS_TOKEN: String = ${kotlinString(accessToken)}
}
"""
    }
}

