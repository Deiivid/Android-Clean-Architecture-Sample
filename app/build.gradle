import com.android.build.api.variant.BuildConfigField

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

def secretProperties = new Properties()
def secretsFile = rootProject.file("secrets.properties")
if (secretsFile.exists()) {
    secretsFile.withInputStream { secretProperties.load(it) }
}

def hasText = { String value -> value != null && !value.trim().isEmpty() }

def credentialValue = { String name ->
    def environmentValue = providers.environmentVariable(name).orNull
    if (hasText(environmentValue)) return environmentValue

    def gradleValue = providers.gradleProperty(name).orNull
    if (hasText(gradleValue)) return gradleValue

    secretProperties.getProperty(name, "")
}

def configurationValue = { String name, String fallback ->
    def environmentValue = providers.environmentVariable(name).orNull
    if (hasText(environmentValue)) return environmentValue

    def gradleValue = providers.gradleProperty(name).orNull
    hasText(gradleValue) ? gradleValue : fallback
}

def quoted = { String value ->
    "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')}\""
}

android {
    namespace = 'com.example.rickymortydn'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId = "com.example.rickymortydn"
        minSdk {
            version = release(30)
        }
        targetSdk {
            version = release(36)
        }
        versionCode = 1
        versionName = "1.0"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.buildConfigFields.put("RICK_AND_MORTY_BASE_URL", new BuildConfigField(
                "String",
                quoted(configurationValue("RICK_AND_MORTY_BASE_URL", "https://rickandmortyapi.com/api/")),
                null
        ))
        variant.buildConfigFields.put("RICK_AND_MORTY_API_KEY", new BuildConfigField(
                "String",
                quoted(credentialValue("RICK_AND_MORTY_API_KEY")),
                null
        ))
        variant.buildConfigFields.put("DEMO_CLIENT_ID", new BuildConfigField(
                "String",
                quoted(credentialValue("DEMO_CLIENT_ID")),
                null
        ))
        variant.buildConfigFields.put("DEMO_TENANT_ID", new BuildConfigField(
                "String",
                quoted(credentialValue("DEMO_TENANT_ID")),
                null
        ))
        variant.buildConfigFields.put("DEMO_ACCESS_TOKEN", new BuildConfigField(
                "String",
                quoted(credentialValue("DEMO_ACCESS_TOKEN")),
                null
        ))
    }
}

